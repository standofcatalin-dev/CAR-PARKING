<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlatWorld M5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a0033;
    font-family: monospace;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    top: 10px; left: 10px;
    color: #ff00ff;
    font-size: 14px;
    text-shadow: 0 0 8px #ff00ff;
    pointer-events: none;
    line-height: 1.6;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
  }
  .btn {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: rgba(255, 0, 255, 0.2);
    border: 2px solid #ff00ff;
    color: #ff00ff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    box-shadow: 0 0 15px #ff00ff;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.9); background: rgba(255,0,255,0.5); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  🏎️ BMW M5 E28<br>
  ⚡ <span id="speed">0</span> км/ч
</div>

<div id="controls">
  <div class="btn" id="btnLeft">◀</div>
  <div class="btn" id="btnRight">▶</div>
</div>

<script>
// === Telegram ===
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// === Canvas ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// === Земля ===
const GROUND_Y = () => H - 120;

// === Машина M5 ===
const car = {
  x: 100,
  y: 0,
  vx: 0,
  vy: 0,
  angle: 0,        // наклон кузова
  wheelAngle: 0,   // вращение колёс
  onGround: true,
  width: 90,
  height: 30,
};

// === Физика ===
const GRAVITY = 0.8;
const ACCEL = 0.6;
const BRAKE = 0.9;
const FRICTION = 0.96;
const MAX_SPEED = 15;

// === Ввод ===
const keys = { left: false, right: false };

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Кнопки для тача
const bindBtn = (id, key) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
  el.addEventListener('mouseleave', () => keys[key] = false);
};
bindBtn('btnLeft', 'left');
bindBtn('btnRight', 'right');

// === Следы шин ===
const skidMarks = [];
const MAX_MARKS = 200;

// === Фон: горы и звёзды ===
const stars = Array.from({length: 60}, () => ({
  x: Math.random() * 2000,
  y: Math.random() * (H * 0.5),
  r: Math.random() * 1.5 + 0.5,
}));

// === Игровой цикл ===
function update() {
  const ground = GROUND_Y();

  // Ускорение / торможение
  if (keys.right) {
    car.vx += ACCEL;
  } else if (keys.left) {
    car.vx -= BRAKE;
  } else {
    car.vx *= FRICTION;
    if (Math.abs(car.vx) < 0.05) car.vx = 0;
  }

  // Ограничение скорости
  car.vx = Math.max(-MAX_SPEED * 0.5, Math.min(MAX_SPEED, car.vx));

  // Гравитация
  car.vy += GRAVITY;

  // Позиция
  car.x += car.vx;
  car.y += car.vy;

  // Коллизия с землёй
  if (car.y + car.height >= ground) {
    car.y = ground - car.height;
    car.vy = 0;
    car.onGround = true;
  } else {
    car.onGround = false;
  }

  // Наклон кузова в зависимости от ускорения
  const targetAngle = -car.vx * 0.02;
  car.angle += (targetAngle - car.angle) * 0.1;

  // Вращение колёс
  car.wheelAngle += car.vx * 0.1;

  // Следы шин (когда на земле и движемся)
  if (car.onGround && Math.abs(car.vx) > 0.5) {
    skidMarks.push({
      x: car.x - car.vx * 5,
      y: ground - 2,
      alpha: 1,
    });
    if (skidMarks.length > MAX_MARKS) skidMarks.shift();
  }

  // Затухание следов
  skidMarks.forEach(m => m.alpha -= 0.003);
  for (let i = skidMarks.length - 1; i >= 0; i--) {
    if (skidMarks[i].alpha <= 0) skidMarks.splice(i, 1);
  }

  // HUD
  document.getElementById('speed').textContent = Math.abs(Math.round(car.vx * 15));
}

function drawBackground() {
  // Небо — градиент заката
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a0033');
  grad.addColorStop(0.5, '#4a0e4e');
  grad.addColorStop(0.8, '#ff006e');
  grad.addColorStop(1, '#ff8c00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Солнце
  ctx.save();
  ctx.beginPath();
  ctx.arc(W * 0.75, H * 0.55, 80, 0, Math.PI * 2);
  const sunGrad = ctx.createRadialGradient(W*0.75, H*0.55, 0, W*0.75, H*0.55, 80);
  sunGrad.addColorStop(0, '#ffff00');
  sunGrad.addColorStop(0.5, '#ff6600');
  sunGrad.addColorStop(1, 'rgba(255, 0, 100, 0)');
  ctx.fillStyle = sunGrad;
  ctx.fill();
  ctx.restore();

  // Звёзды
  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.001 + s.x) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Сетка на земле (перспектива)
  const ground = GROUND_Y();
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  for (let i = 0; i < 20; i++) {
    const y = ground + i * 8;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  const ground = GROUND_Y();
  // Асфальт
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, ground, W, H - ground);

  // Неоновая линия дороги
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff00ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, ground);
  ctx.lineTo(W, ground);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawSkidMarks() {
  skidMarks.forEach(m => {
    ctx.fillStyle = `rgba(0, 0, 0, ${m.alpha * 0.6})`;
    ctx.fillRect(m.x, m.y, 8, 3);
  });
}

function drawCar() {
  const cx = car.x;
  const cy = car.y;
  const w = car.width;
  const h = car.height;

  ctx.save();
  ctx.translate(cx + w/2, cy + h/2);
  ctx.rotate(car.angle);
  ctx.translate(-w/2, -h/2);

  // Тень
  ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
  ctx.shadowColor = '#ff00ff';
  ctx.shadowBlur = 20;

  // Кузов (нижняя часть)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.4);
  ctx.lineTo(w, h * 0.4);
  ctx.lineTo(w - 5, h);
  ctx.lineTo(5, h);
  ctx.closePath();
  ctx.fill();

  // Крыша (верхняя часть)
  ctx.beginPath();
  ctx.moveTo(w * 0.15, h * 0.4);
  ctx.lineTo(w * 0.3, 0);
  ctx.lineTo(w * 0.75, 0);
  ctx.lineTo(w * 0.9, h * 0.4);
  ctx.closePath();
  ctx.fillStyle = '#e0e0e0';
  ctx.fill();

  // Стекло
  ctx.fillStyle = '#00ffff';
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(w * 0.22, h * 0.4);
  ctx.lineTo(w * 0.33, h * 0.05);
  ctx.lineTo(w * 0.72, h * 0.05);
  ctx.lineTo(w * 0.85, h * 0.4);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Полоса M (триколор)
  ctx.fillStyle = '#0066cc';
  ctx.fillRect(w * 0.35, h * 0.5, w * 0.05, h * 0.3);
  ctx.fillStyle = '#6600cc';
  ctx.fillRect(w * 0.4, h * 0.5, w * 0.05, h * 0.3);
  ctx.fillStyle = '#cc0000';
  ctx.fillRect(w * 0.45, h * 0.5, w * 0.05, h * 0.3);

  // Фара
  ctx.fillStyle = '#ffff00';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 15;
  ctx.fillRect(w - 8, h * 0.5, 6, h * 0.3);
  ctx.shadowBlur = 0;

  // Стоп-сигнал
  if (keys.left) {
    ctx.fillStyle = '#ff0000';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 15;
    ctx.fillRect(2, h * 0.5, 6, h * 0.3);
    ctx.shadowBlur = 0;
  }

  // Выхлоп
  if (keys.right) {
    ctx.fillStyle = 'rgba(255, 200, 0, 0.7)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(-5 - i*8, h * 0.85, 3 - i*0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();

  // Колёса (не вращаются с кузовом — они на земле)
  drawWheel(cx + 15, cy + h + 2, 12);
  drawWheel(cx + w - 20, cy + h + 2, 12);
}

function drawWheel(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(car.wheelAngle);

  // Шина
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Диск
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
  ctx.fill();

  // Спицы
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const a = (Math.PI * 2 / 5) * i;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6);
    ctx.stroke();
  }

  ctx.restore();
}

function render() {
  drawBackground();
  drawGround();
  drawSkidMarks();
  drawCar();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// Старт
car.y = GROUND_Y() - car.height;
loop();
</script>
</body>
</html>
