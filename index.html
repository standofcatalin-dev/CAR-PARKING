<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlatWorld 3D — BMW M5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0015;
    font-family: monospace;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  #hud {
    position: fixed;
    top: 12px; left: 12px;
    color: #ff00ff;
    font-size: 14px;
    text-shadow: 0 0 8px #ff00ff;
    pointer-events: none;
    line-height: 1.6;
    z-index: 10;
  }
  #controls {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 10;
  }
  .btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255, 0, 255, 0.15);
    border: 2px solid #ff00ff;
    color: #ff00ff;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px #ff00ff;
    transition: transform 0.1s, background 0.1s;
    user-select: none;
    touch-action: none;
  }
  .btn:active { transform: scale(0.9); background: rgba(255,0,255,0.5); }
</style>
</head>
<body>

<div id="hud">
  🏎️ BMW M5 E28 · 3D<br>
  ⚡ <span id="speed">0</span> км/ч
</div>

<div id="controls">
  <div class="btn" id="btnLeft">◀</div>
  <div class="btn" id="btnRight">▶</div>
</div>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// === Telegram ===
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

// === Сцена ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0033);
scene.fog = new THREE.Fog(0x1a0033, 30, 120);

// === Камера ===
const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);

// === Рендер ===
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// === Свет ===
// Ambient
scene.add(new THREE.AmbientLight(0x442266, 0.6));

// Солнце
const sun = new THREE.DirectionalLight(0xffaa66, 1.4);
sun.position.set(-20, 30, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 100;
scene.add(sun);

// Неоновый подсвет снизу
const neonLight = new THREE.PointLight(0xff00ff, 1.5, 30);
neonLight.position.set(0, 1, 0);
scene.add(neonLight);

// === Земля ===
const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a1a,
  roughness: 0.9,
  metalness: 0.1,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Неоновая сетка на земле
const grid = new THREE.GridHelper(400, 100, 0xff00ff, 0x6600aa);
grid.position.y = 0.01;
scene.add(grid);

// === Машина M5 ===
const car = new THREE.Group();

// Кузов — основная коробка
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.4,
  metalness: 0.7,
});
const bodyGeo = new THREE.BoxGeometry(4.2, 0.6, 1.8);
const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
bodyMesh.position.y = 0.7;
bodyMesh.castShadow = true;
car.add(bodyMesh);

// Капот — сужение спереди
const hoodGeo = new THREE.BoxGeometry(1.2, 0.4, 1.7);
const hoodMesh = new THREE.Mesh(hoodGeo, bodyMat);
hoodMesh.position.set(2.0, 0.6, 0);
hoodMesh.castShadow = true;
car.add(hoodMesh);

// Крыша кабины
const roofGeo = new THREE.BoxGeometry(1.8, 0.7, 1.6);
const roofMesh = new THREE.Mesh(roofGeo, bodyMat);
roofMesh.position.set(-0.3, 1.35, 0);
roofMesh.castShadow = true;
car.add(roofMesh);

// Стёкла (синие светящиеся)
const glassMat = new THREE.MeshStandardMaterial({
  color: 0x00ffff,
  emissive: 0x006677,
  emissiveIntensity: 0.6,
  metalness: 0.9,
  roughness: 0.1,
  transparent: true,
  opacity: 0.85,
});
const glassGeo = new THREE.BoxGeometry(1.5, 0.55, 1.62);
const glassMesh = new THREE.Mesh(glassGeo, glassMat);
glassMesh.position.set(-0.3, 1.35, 0);
car.add(glassMesh);

// Полоса M — триколор
const mColors = [0x0066cc, 0x6600cc, 0xcc0000];
mColors.forEach((color, i) => {
  const stripeMat = new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.4,
  });
  const stripeGeo = new THREE.BoxGeometry(3.5, 0.05, 0.15);
  const stripe = new THREE.Mesh(stripeGeo, stripeMat);
  stripe.position.set(0, 1.01, -0.4 + i * 0.3);
  car.add(stripe);
});

// Фары
const headlightMat = new THREE.MeshStandardMaterial({
  color: 0xffff00,
  emissive: 0xffff00,
  emissiveIntensity: 2,
});
const headlightGeo = new THREE.BoxGeometry(0.15, 0.25, 0.4);
[0.5, -0.5].forEach(z => {
  const hl = new THREE.Mesh(headlightGeo, headlightMat);
  hl.position.set(2.55, 0.7, z);
  car.add(hl);
});

// Стоп-сигналы
const taillightMat = new THREE.MeshStandardMaterial({
  color: 0xff0000,
  emissive: 0xff0000,
  emissiveIntensity: 0,
});
const taillightGeo = new THREE.BoxGeometry(0.15, 0.25, 0.4);
const taillights = [];
[0.5, -0.5].forEach(z => {
  const tl = new THREE.Mesh(taillightGeo, taillightMat.clone());
  tl.position.set(-2.1, 0.7, z);
  car.add(tl);
  taillights.push(tl);
});

// Колёса
const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 20);
const tireMat = new THREE.MeshStandardMaterial({
  color: 0x111111,
  roughness: 0.9,
});
const rimMat = new THREE.MeshStandardMaterial({
  color: 0xcccccc,
  metalness: 1,
  roughness: 0.2,
});

const wheels = [];
const wheelPositions = [
  [1.4, 0.5, 0.9],
  [1.4, 0.5, -0.9],
  [-1.4, 0.5, 0.9],
  [-1.4, 0.5, -0.9],
];

wheelPositions.forEach(pos => {
  const wheel = new THREE.Group();

  const tire = new THREE.Mesh(wheelGeo, tireMat);
  tire.rotation.x = Math.PI / 2;
  tire.castShadow = true;
  wheel.add(tire);

  // Диск (внутренний цилиндр)
  const rimGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.32, 12);
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.rotation.x = Math.PI / 2;
  wheel.add(rim);

  wheel.position.set(...pos);
  car.add(wheel);
  wheels.push(wheel);
});

// Тень под машиной (fake, для красоты)
const shadowGeo = new THREE.PlaneGeometry(4.5, 2);
const shadowMat = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.5,
});
const carShadow = new THREE.Mesh(shadowGeo, shadowMat);
carShadow.rotation.x = -Math.PI / 2;
carShadow.position.y = 0.02;
car.add(carShadow);

scene.add(car);

// === Управление ===
const keys = { left: false, right: false };

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn('btnLeft', 'left');
bindBtn('btnRight', 'right');

// === Физика ===
let speed = 0;
const MAX_SPEED = 0.35;
const ACCEL = 0.012;
const BRAKE = 0.02;
const FRICTION = 0.96;

// === Частицы выхлопа ===
const exhaustParticles = [];
const exhaustGeo = new THREE.SphereGeometry(0.12, 6, 6);
const exhaustMat = new THREE.MeshBasicMaterial({
  color: 0xff8800,
  transparent: true,
  opacity: 0.8,
});

function spawnExhaust() {
  const p = new THREE.Mesh(exhaustGeo, exhaustMat.clone());
  p.position.set(-2.2, 0.4, 0.6); // задний выхлоп
  car.parent.add(p);
  exhaustParticles.push({
    mesh: p,
    life: 1,
    vx: -0.05 - Math.random() * 0.05,
    vy: 0.02 + Math.random() * 0.03,
  });
}

// === Следы шин ===
const skidMarks = [];
const skidGeo = new THREE.PlaneGeometry(0.3, 0.4);
const skidMat = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.7,
});

function spawnSkid(x, z) {
  const mark = new THREE.Mesh(skidGeo, skidMat);
  mark.rotation.x = -Math.PI / 2;
  mark.position.set(x, 0.01, z);
  scene.add(mark);
  skidMarks.push({ mesh: mark, life: 1 });
  if (skidMarks.length > 200) {
    const old = skidMarks.shift();
    scene.remove(old.mesh);
  }
}

// === HUD ===
const speedEl = document.getElementById('speed');

// === Цикл ===
let lastTime = performance.now();
let skidTimer = 0;
let exhaustTimer = 0;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;

  // Управление
  if (keys.right) {
    speed += ACCEL * dt;
  } else if (keys.left) {
    speed -= BRAKE * dt;
  } else {
    speed *= FRICTION;
    if (Math.abs(speed) < 0.001) speed = 0;
  }

  speed = Math.max(-MAX_SPEED * 0.6, Math.min(MAX_SPEED, speed));

  // Движение вперёд (по X)
  car.position.x += speed * dt * 10;

  // Колёса крутятся
  wheels.forEach(w => {
    w.rotation.z -= speed * 0.3;
  });

  // Стоп-сигналы
  const braking = keys.left && speed > 0.01;
  taillights.forEach(t => {
    t.material.emissiveIntensity = braking ? 3 : 0;
  });

  // Выхлоп
  exhaustTimer += dt;
  if (keys.right && exhaustTimer > 2) {
    spawnExhaust();
    exhaustTimer = 0;
  }

  // Обновление частиц выхлопа
  for (let i = exhaustParticles.length - 1; i >= 0; i--) {
    const p = exhaustParticles[i];
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.life -= 0.02 * dt;
    p.mesh.material.opacity = p.life * 0.8;
    p.mesh.scale.setScalar(1 + (1 - p.life) * 2);
    if (p.life <= 0) {
      car.parent.remove(p.mesh);
      exhaustParticles.splice(i, 1);
    }
  }

  // Следы шин
  skidTimer += dt;
  if (Math.abs(speed) > 0.05 && skidTimer > 3) {
    skidTimer = 0;
    // Задние колёса
    spawnSkid(car.position.x - 1.4, car.position.z + 0.9);
    spawnSkid(car.position.x - 1.4, car.position.z - 0.9);
  }

  // Затухание следов
  for (let i = skidMarks.length - 1; i >= 0; i--) {
    const m = skidMarks[i];
    m.life -= 0.002 * dt;
    m.mesh.material.opacity = m.life * 0.7;
    if (m.life <= 0) {
      scene.remove(m.mesh);
      skidMarks.splice(i, 1);
    }
  }

  // Камера — следует за машиной сзади-сбоку
  const camTargetX = car.position.x - 7;
  const camTargetY = 4;
  const camTargetZ = 6;
  camera.position.x += (camTargetX - camera.position.x) * 0.05;
  camera.position.y += (camTargetY - camera.position.y) * 0.05;
  camera.position.z += (camTargetZ - camera.position.z) * 0.05;
  camera.lookAt(car.position.x + 2, 1, 0);

  // Неоновый свет следует за машиной
  neonLight.position.x = car.position.x;

  // HUD
  speedEl.textContent = Math.abs(Math.round(speed * 700));

  renderer.render(scene, camera);
}

// Стартовая позиция камеры
camera.position.set(-7, 4, 6);
camera.lookAt(2, 1, 0);

animate();

// === Resize ===
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
