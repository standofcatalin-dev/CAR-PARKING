<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlatWorld 3D — BMW M5 F90</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0015; font-family: monospace;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  #hud {
    position: fixed; top: 12px; left: 12px;
    color: #ff00ff; font-size: 14px;
    text-shadow: 0 0 8px #ff00ff;
    pointer-events: none; line-height: 1.6; z-index: 10;
  }
  #controls {
    position: fixed; bottom: 20px;
    left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 20px; z-index: 10;
    align-items: flex-end;
  }
  .left-group, .right-group { display: flex; gap: 12px; }
  .btn {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255, 0, 255, 0.15);
    border: 2px solid #ff00ff; color: #ff00ff;
    font-size: 26px; display: flex;
    align-items: center; justify-content: center;
    box-shadow: 0 0 15px #ff00ff;
    transition: transform 0.1s, background 0.1s;
    user-select: none; touch-action: none;
  }
  .btn:active { transform: scale(0.9); background: rgba(255,0,255,0.5); }
  .btn.small { width: 60px; height: 60px; font-size: 22px; }
  #error {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ff5555; background: rgba(0,0,0,0.85);
    padding: 20px; font-size: 14px; max-width: 90%;
    display: none; z-index: 100; border-radius: 8px;
    word-break: break-all; line-height: 1.5;
  }
</style>
</head>
<body>

<div id="hud">
  🏎️ BMW M5 F90 · 3D<br>
  ⚡ <span id="speed">0</span> км/ч
</div>

<div id="controls">
  <div class="left-group">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="right-group">
    <div class="btn small" id="btnBack">▼</div>
    <div class="btn small" id="btnForward">▲</div>
  </div>
</div>

<div id="error"></div>

<script src="game.js"></script>

</body>
</html>
